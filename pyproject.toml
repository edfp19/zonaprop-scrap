[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zona-oportunidades"
version = "0.1.0"
description = "Pipeline medallion para analizar oportunidades inmobiliarias en CABA y AMBA"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = []

[project.optional-dependencies]
collection = [
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "selenium>=4.27,<5",
]
api = [
  "fastapi>=0.115,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "uvicorn[standard]>=0.32,<1",
]
dashboard = [
  "flask>=3.1,<4",
  "requests>=2.32,<3",
]
silver = [
  "pyspark==3.5.6",
]
[dependency-groups]
dev = [
  "mutmut>=3,<4",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/zona_oportunidades"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
files = [
  "src/zona_oportunidades/opportunities",
  "src/zona_oportunidades/presentation/api/main.py",
  "src/zona_oportunidades/presentation/dashboard/app.py",
  "src/zona_oportunidades/pipeline",
]
strict = true
follow_imports = "silent"
ignore_missing_imports = true

[tool.mutmut]
source_paths = ["src/"]
only_mutate = ["src/zona_oportunidades/opportunities/domain.py"]
pytest_add_cli_args = ["-q"]
pytest_add_cli_args_test_selection = ["tests/opportunities/test_domain.py"]
