[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zona-oportunidades"
version = "0.1.0"
description = "Pipeline medallion para analizar oportunidades inmobiliarias en CABA y AMBA"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = []

[project.optional-dependencies]
collection = [
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "selenium>=4.27,<5",
]
api = [
  "fastapi>=0.115,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "uvicorn[standard]>=0.32,<1",
]
dashboard = [
  "requests>=2.32,<3",
  "taipy-gui>=4,<5",
]
[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/zona_oportunidades"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
