name: zona-oportunidades

x-app-environment: &app_environment
  DATA_ROOT: /data
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB:-zonaprop}
  POSTGRES_USER: ${POSTGRES_USER:-zonaprop}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zonaprop}
  SELENIUM_URL: http://selenium:4444/wd/hub
  COLLECTION_MAX_PAGES: ${COLLECTION_MAX_PAGES:-1}
  COLLECTION_DELAY_SECONDS: ${COLLECTION_DELAY_SECONDS:-3}
  PIPELINE_INTERVAL_SECONDS: ${PIPELINE_INTERVAL_SECONDS:-86400}
  COMPARABLE_MIN_COUNT: ${COMPARABLE_MIN_COUNT:-10}
  COMPARABLE_AREA_TOLERANCE: ${COMPARABLE_AREA_TOLERANCE:-0.15}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zonaprop}
      POSTGRES_USER: ${POSTGRES_USER:-zonaprop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zonaprop}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zonaprop} -d ${POSTGRES_DB:-zonaprop}"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "5432:5432"

  selenium:
    image: selenium/standalone-chromium:4.49.0-20260909
    shm_size: 2gb
    environment:
      SE_NODE_MAX_SESSIONS: 1
      SE_SESSION_REQUEST_TIMEOUT: 120
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4444/wd/hub/status | grep -q '\"ready\": true'"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "4444:4444"
      - "7900:7900"

  migrate:
    image: postgres:16-alpine
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-zonaprop}
      PGUSER: ${POSTGRES_USER:-zonaprop}
      PGPASSWORD: ${POSTGRES_PASSWORD:-zonaprop}
    volumes:
      - ./infra/postgres:/migrations:ro
    command:
      - psql
      - -v
      - ON_ERROR_STOP=1
      - -f
      - /migrations/init.sql
      - -f
      - /migrations/migrate_gold.sql
      - -f
      - /migrations/pipeline_storage.sql
      - -f
      - /migrations/bronze_quarantine.sql
      - -f
      - /migrations/pipeline_budget.sql
    depends_on:
      postgres:
        condition: service_healthy

  pipeline:
    build:
      context: .
      target: pipeline
    command: ["python", "-m", "zona_oportunidades.pipeline.entrypoint"]
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app_environment
      SPARK_MASTER: ${SPARK_MASTER:-local[2]}
      TZ: UTC
    volumes:
      - ./data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      selenium:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      target: api
    command: ["uvicorn", "zona_oportunidades.presentation.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: *app_environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/salud"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "8000:8000"
    restart: unless-stopped

  dashboard:
    build:
      context: .
      target: dashboard
    command: ["python", "-m", "zona_oportunidades.presentation.dashboard.app"]
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8501:8501"
    restart: unless-stopped

volumes:
  postgres_data:
