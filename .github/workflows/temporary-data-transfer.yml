name: Temporary verified local data transfer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install transfer dependencies
        run: python -m pip install boto3 'psycopg[binary]'
      - name: Upload and verify local data backup
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_REGION: ${{ vars.S3_REGION }}
          PYTHONPATH: src
          CHUNK_00: ${{ secrets.CLEANUP_TRANSFER_00 }}
          CHUNK_01: ${{ secrets.CLEANUP_TRANSFER_01 }}
          CHUNK_02: ${{ secrets.CLEANUP_TRANSFER_02 }}
          CHUNK_03: ${{ secrets.CLEANUP_TRANSFER_03 }}
          CHUNK_04: ${{ secrets.CLEANUP_TRANSFER_04 }}
          CHUNK_05: ${{ secrets.CLEANUP_TRANSFER_05 }}
          CHUNK_06: ${{ secrets.CLEANUP_TRANSFER_06 }}
          CHUNK_07: ${{ secrets.CLEANUP_TRANSFER_07 }}
          CHUNK_08: ${{ secrets.CLEANUP_TRANSFER_08 }}
          CHUNK_09: ${{ secrets.CLEANUP_TRANSFER_09 }}
          CHUNK_10: ${{ secrets.CLEANUP_TRANSFER_10 }}
          CHUNK_11: ${{ secrets.CLEANUP_TRANSFER_11 }}
          CHUNK_12: ${{ secrets.CLEANUP_TRANSFER_12 }}
          CHUNK_13: ${{ secrets.CLEANUP_TRANSFER_13 }}
          CHUNK_14: ${{ secrets.CLEANUP_TRANSFER_14 }}
          CHUNK_15: ${{ secrets.CLEANUP_TRANSFER_15 }}
          CHUNK_16: ${{ secrets.CLEANUP_TRANSFER_16 }}
          CHUNK_17: ${{ secrets.CLEANUP_TRANSFER_17 }}
          CHUNK_18: ${{ secrets.CLEANUP_TRANSFER_18 }}
          CHUNK_19: ${{ secrets.CLEANUP_TRANSFER_19 }}
          CHUNK_20: ${{ secrets.CLEANUP_TRANSFER_20 }}
          CHUNK_21: ${{ secrets.CLEANUP_TRANSFER_21 }}
          CHUNK_22: ${{ secrets.CLEANUP_TRANSFER_22 }}
          CHUNK_23: ${{ secrets.CLEANUP_TRANSFER_23 }}
          CHUNK_24: ${{ secrets.CLEANUP_TRANSFER_24 }}
          CHUNK_25: ${{ secrets.CLEANUP_TRANSFER_25 }}
          CHUNK_26: ${{ secrets.CLEANUP_TRANSFER_26 }}
          CHUNK_27: ${{ secrets.CLEANUP_TRANSFER_27 }}
          CHUNK_28: ${{ secrets.CLEANUP_TRANSFER_28 }}
          CHUNK_29: ${{ secrets.CLEANUP_TRANSFER_29 }}
          CHUNK_30: ${{ secrets.CLEANUP_TRANSFER_30 }}
          CHUNK_31: ${{ secrets.CLEANUP_TRANSFER_31 }}
          CHUNK_32: ${{ secrets.CLEANUP_TRANSFER_32 }}
          CHUNK_33: ${{ secrets.CLEANUP_TRANSFER_33 }}
          CHUNK_34: ${{ secrets.CLEANUP_TRANSFER_34 }}
          CHUNK_35: ${{ secrets.CLEANUP_TRANSFER_35 }}
        run: |
          python - <<'PY'
          import base64, hashlib, io, json, os, tarfile, tempfile
          from pathlib import Path
          from zona_oportunidades.operations.storage import S3Store, Generation, build_manifest
          payload = base64.b64decode("".join(os.environ[f"CHUNK_{i:02d}"] for i in range(36)), validate=True)
          assert hashlib.sha256(payload).hexdigest() == '93648daab80f10c56916cb0f22ce538867676a720e4c6f7b6867111552cbf9bc'
          with tempfile.TemporaryDirectory() as work:
              root = Path(work)
              with tarfile.open(fileobj=io.BytesIO(payload), mode="r:gz") as archive:
                  archive.extractall(root / "source", filter="data")
              source = root / "source" / "data"
              assert sum(p.is_file() for p in source.rglob("*")) == 91
              manifest = build_manifest(source, generation_id="20261027-folder-cleanup", kind="local-backups", rows=0, source_runs=())
              store = S3Store(os.environ["S3_BUCKET"], os.environ["S3_ENDPOINT_URL"], os.environ["S3_REGION"])
              prefix = store.upload(source, manifest)
              restored = store.download(Generation(manifest, prefix, "preparing"), root / "readback")
              for artifact in manifest.files:
                  assert hashlib.sha256((restored / artifact.path).read_bytes()).hexdigest() == artifact.sha256
              print(json.dumps({"prefix": prefix, "verified_files": len(manifest.files), "verified_bytes": sum(p.bytes for p in manifest.files), "parquet_files": sum(p.path.endswith(".parquet") for p in manifest.files), "readback_verified": True}))
          PY
